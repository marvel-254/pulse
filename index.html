<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c12" />
  <meta name="description" content="Pulse — a personal, mobile-first developer operations command center powered by GitHub." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Pulse — Developer Command Center</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <!-- Ambient / status bar -->
  <header class="topbar" id="topbar"></header>

  <!-- Reachable global content -->
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Mobile nav -->
    <nav class="mobilenav" id="mobilenav"></nav>

    <main class="stage" id="stage">
      <div class="loading" id="loading">
        <div class="pulse-ring"></div>
        <span>BOOTING PULSE</span>
      </div>
    </main>
  </div>

  <!-- Repo selector overlay -->
  <div class="overlay" id="repoOverlay" aria-hidden="true">
    <div class="sheet" id="repoSheet"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
