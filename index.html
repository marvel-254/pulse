<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000080" id="metaThemeColor" />
  <meta name="description" content="Pulse — a 1997-flavoured public showcase of two GitHub accounts: projects, activity, releases and CI. No login, no tracking." />
  <link rel="canonical" href="https://marvel-254.github.io/pulse/" />

  <!-- Social cards (absolute URLs are required by most crawlers) -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Pulse" />
  <meta property="og:title" content="Pulse — Public GitHub Showcase" />
  <meta property="og:description" content="A public, read-only showcase of two GitHub accounts — projects, contribution history, releases and CI. No login." />
  <meta property="og:url" content="https://marvel-254.github.io/pulse/" />
  <meta property="og:image" content="https://marvel-254.github.io/pulse/icons/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pulse — public GitHub showcase" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pulse — Public GitHub Showcase" />
  <meta name="twitter:description" content="A public, read-only showcase of two GitHub accounts — projects, contribution history, releases and CI. No login." />
  <meta name="twitter:image" content="https://marvel-254.github.io/pulse/icons/og.png" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "name": "Pulse — Public GitHub Showcase",
      "url": "https://marvel-254.github.io/pulse/",
      "description": "A public, read-only showcase of two GitHub accounts: projects, contribution history, releases and CI.",
      "mainEntity": {
        "@type": "Person",
        "name": "marvel-254",
        "url": "https://github.com/marvel-254",
        "sameAs": ["https://github.com/marvel-254", "https://github.com/oliver4441"]
      }
    }
  </script>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Pulse — Public GitHub Showcase</title>
  <!-- Fonts are self-hosted (fonts/*.woff2): no third-party requests. -->
  <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Prevent theme flash
    try {
      const saved = localStorage.getItem("pulse-theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#stage">Skip to content</a>

  <div class="grid-bg" aria-hidden="true"></div>

  <!-- Ambient / status bar -->
  <header class="topbar" id="topbar"></header>

  <!-- Reachable global content -->
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sections and tools"></aside>

    <main class="stage" id="stage" tabindex="-1">
      <div class="loading" id="loading">
        <div class="pulse-ring"></div>
        <span>BOOTING PULSE</span>
      </div>
    </main>
  </div>

  <!-- Mobile nav -->
  <nav class="mobilenav" id="mobilenav"></nav>

  <!-- Repo selector overlay -->
  <div class="overlay" id="repoOverlay" role="dialog" aria-modal="true" aria-label="Repository details" aria-hidden="true">
    <div class="sheet" id="repoSheet"></div>
  </div>

  <!-- Command Palette overlay -->
  <div class="overlay" id="paletteOverlay" role="dialog" aria-modal="true" aria-label="Command palette" aria-hidden="true">
    <div class="palette" id="paletteSheet"></div>
  </div>

  <!-- Suggest / Contact overlay -->
  <div class="overlay" id="issueOverlay" role="dialog" aria-modal="true" aria-label="Issue feed" aria-hidden="true">
    <div class="sheet" id="issueSheet"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
