<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="120" fill="#07090e"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Ambient Inner Glow Rings -->
  <circle cx="256" cy="256" r="180" stroke="url(#pulseGrad)" stroke-width="8" opacity="0.2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="140" stroke="url(#pulseGrad)" stroke-width="4" opacity="0.3"/>

  <!-- Pulse Waveform & Command Node -->
  <path d="M72 256 H168 L204 164 L256 360 L308 200 L344 256 H440" 
        stroke="url(#pulseGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Active Signal Indicator Dots -->
  <circle cx="204" cy="164" r="12" fill="#22d3ee" filter="url(#neonGlow)"/>
  <circle cx="308" cy="200" r="12" fill="#8b5cf6" filter="url(#neonGlow)"/>
  <circle cx="256" cy="360" r="14" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
