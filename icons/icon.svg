<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pulse">
  <title>Pulse</title>
  <!-- A 1997 application icon: navy face, hard pixel waveform, Windows 95 bevel.
       No gradients, no blur, no rounded corners. -->

  <!-- outer raised bevel -->
  <rect x="0" y="0" width="512" height="512" fill="#c0c0c0"/>
  <path d="M0 0h512v512H0z" fill="none"/>
  <rect x="0" y="0" width="512" height="16" fill="#ffffff"/>
  <rect x="0" y="0" width="16" height="512" fill="#ffffff"/>
  <rect x="0" y="496" width="512" height="16" fill="#000000"/>
  <rect x="496" y="0" width="16" height="512" fill="#000000"/>
  <rect x="16" y="16" width="480" height="8" fill="#dfdfdf"/>
  <rect x="16" y="16" width="8" height="480" fill="#dfdfdf"/>
  <rect x="16" y="488" width="480" height="8" fill="#808080"/>
  <rect x="488" y="16" width="8" height="480" fill="#808080"/>

  <!-- sunken screen -->
  <rect x="32" y="32" width="448" height="448" fill="#000080"/>

  <!-- screen scanlines -->
  <g fill="#000060">
    <rect x="32" y="80" width="448" height="8"/>
    <rect x="32" y="160" width="448" height="8"/>
    <rect x="32" y="240" width="448" height="8"/>
    <rect x="32" y="320" width="448" height="8"/>
    <rect x="32" y="400" width="448" height="8"/>
  </g>

  <!-- pixel waveform: flat, dip, spike, flat -->
  <g fill="#00ff00">
    <rect x="48" y="256" width="64" height="32"/>
    <rect x="112" y="224" width="32" height="64"/>
    <rect x="144" y="288" width="32" height="64"/>
    <rect x="176" y="160" width="32" height="192"/>
    <rect x="208" y="224" width="32" height="64"/>
    <rect x="240" y="256" width="224" height="32"/>
  </g>

  <!-- highlight on the leading edge of the waveform -->
  <g fill="#00aa00">
    <rect x="48" y="280" width="64" height="8"/>
    <rect x="240" y="280" width="224" height="8"/>
  </g>

  <!-- an "LIVE" status light, like a 90s hardware panel -->
  <rect x="416" y="64" width="32" height="32" fill="#ff0000"/>
  <rect x="416" y="64" width="32" height="8" fill="#ff8888"/>
  <rect x="416" y="88" width="32" height="8" fill="#800000"/>
  <rect x="416" y="64" width="8" height="32" fill="#ff8888"/>
  <rect x="440" y="64" width="8" height="32" fill="#800000"/>
</svg>
